name: AuriCombat
version: '${project.version}'
main: dev.auri.combat.AuriCombatPlugin
api-version: '1.21'
description: DonutSMP-style TPA and combat tagging.
author: Auri
folia-supported: false

commands:
  tpa:
    description: Request to teleport to a player.
    usage: /tpa <player>
    permission: auri.tpa.use
  tpahere:
    description: Request that a player teleports to you.
    usage: /tpahere <player>
    permission: auri.tpa.use
  tpaccept:
    description: Accept a pending teleport request.
    usage: /tpaccept [player]
    aliases: [tpyes]
    permission: auri.tpa.use
  tpdeny:
    description: Deny a pending teleport request.
    usage: /tpdeny [player]
    aliases: [tpadeny, tpno]
    permission: auri.tpa.use
  tpacancel:
    description: Cancel your outgoing teleport request.
    usage: /tpacancel
    aliases: [tpcancel]
    permission: auri.tpa.use
  tpatoggle:
    description: Toggle whether you receive teleport requests.
    usage: /tpatoggle
    aliases: [tptoggle]
    permission: auri.tpa.use
  tpaguitoggle:
    description: Switch between the menu and chat request styles.
    usage: /tpaguitoggle
    permission: auri.tpa.use
  auricombat:
    description: AuriCombat admin commands.
    usage: /auricombat reload
    aliases: [auri]
    permission: auri.admin

permissions:
  auri.tpa.use:
    description: Use the TPA commands.
    default: true
  auri.tpa.bypass.warmup:
    description: Teleport instantly, skipping the warmup.
    default: op
  auri.tpa.bypass.cooldown:
    description: Send requests with no cooldown.
    default: op
  auri.combat.bypass:
    description: Never get combat tagged.
    default: false
  auri.admin:
    description: Reload the config.
    default: op
