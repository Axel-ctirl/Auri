name: CI

on:
  push:
    paths:
      - "bread-ai/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "bread-ai/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# The default token is broader than this workflow needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bread-ai

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bread-ai/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Type check
        run: mypy

      - name: Test
        # The suite runs on the mock backend and the hashing embedder, so it
        # needs no GPU, no model weights and no network.
        run: pytest --cov=backend/app --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bread-ai/frontend/package-lock.json

      - name: Install dependencies
        working-directory: bread-ai/frontend
        run: npm ci

      - name: Type check
        working-directory: bread-ai/frontend
        run: npm run typecheck

      - name: Test
        working-directory: bread-ai/frontend
        run: npm test

      - name: Build
        working-directory: bread-ai/frontend
        run: npm run build

  scripts:
    name: CLI pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bread-ai/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect, clean, validate and report on a sample project
        # Exercises the real command-line path end to end against this
        # repository's own permissively-licensed source.
        run: |
          python scripts/license_check.py --path .
          python scripts/collect_local_code.py \
            --path . \
            --name ci_sample \
            --output data/datasets/ci_sample.jsonl \
            --languages python \
            --max-records 50
          python scripts/clean_dataset.py --input data/datasets/ci_sample.jsonl
          python scripts/validate_dataset.py --input data/datasets/ci_sample.clean.jsonl
          python scripts/dataset_report.py --input data/datasets/ci_sample.clean.jsonl
          python scripts/scan_secrets.py --dataset data/datasets/ci_sample.clean.jsonl

      - name: Build the identity corpus and rehearse the bake
        # No GPU here, so the bake stops cleanly at the training preflight.
        # What this proves is that the corpus parses, substitutes and validates.
        run: |
          python scripts/build_identity_dataset.py \
            --output data/datasets/ci_identity.jsonl \
            --mix data/datasets/ci_sample.clean.jsonl \
            --mix-ratio 8 \
            --repeat 1
          python scripts/validate_dataset.py --input data/datasets/ci_identity.jsonl
          python scripts/bake_bread_model.py --dry-run --output-name ci-bake || true
          test ! -d data/models/ci-bake

      - name: The coding benchmark is solvable and the rubric discriminates
        # No model needed: this checks the evaluators themselves, so a broken
        # benchmark cannot silently make a model look bad.
        run: |
          python -m pytest backend/tests/test_quality.py -q
          # The reference checker must be clean on code that is known good.
          python scripts/check_code.py --file backend/app/services/quality/api_check.py

      - name: External collectors refuse without accepted terms
        run: |
          ! python scripts/collect_stack_sample.py
          ! python scripts/download_model.py --model-id Qwen/Qwen2.5-Coder-7B-Instruct
