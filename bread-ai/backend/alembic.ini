# Alembic configuration for Bread.
#
# Bread's normal startup path calls init_db(), which creates tables and adds any
# nullable column a newer version expects. Alembic is here for the changes that
# cannot be expressed that way: renaming a column, changing a type, backfilling
# data, or dropping something.
#
#   cd backend
#   alembic revision --autogenerate -m "describe the change"
#   alembic upgrade head
#
# The database URL is read from Bread's settings at runtime (see alembic/env.py),
# so it follows BREAD_DATABASE_URL and BREAD_DATA_DIR rather than being pinned
# here.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
