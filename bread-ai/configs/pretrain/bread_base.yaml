# Bread Base (299M) — pretrained from random initialisation. No inherited weights.
#
# The largest size most people should attempt. A day and a half of training and 24 GB of text. It handles longer context and produces noticeably more coherent code than the small model.
#
# Measured shape and honest budget
# --------------------------------
#   parameters              298,632,192
#   non-embedding           265,864,192
#   compute-optimal tokens  6.0 billion   (about 20 per parameter)
#   corpus needed           roughly 24 GB of text
#   estimated time          roughly 1.5 days on one RTX 5090
#
# The time estimate assumes about 80 effective TFLOPS in bf16, which is a
# plausible mid-range figure for a 5090 at this model size. Do not trust it:
# the trainer measures actual tokens per second in the first hundred steps and
# prints a projected finish from that. Use the measurement, not this comment.
#
# The binding constraint is usually data, not compute. If you cannot feed it
# the corpus above, drop to the next size down rather than undertraining this
# one. A well-trained small model beats a starved large one at every task.

name: bread-base
corpus_path: data/pretrain/corpus.bin
tokenizer_dir: data/pretrain/tokenizer
output_dir: data/runs/pretrain-bread-base

# ------------------------------------------------------------------ model shape
vocab_size: 32000
hidden_size: 1024
intermediate_size: 2752
num_hidden_layers: 24
num_attention_heads: 16
num_key_value_heads: 4
sequence_length: 2048
rope_theta: 10000.0
tie_word_embeddings: true

# --------------------------------------------------------------------- schedule
max_steps: 11400
batch_size: 8
gradient_accumulation_steps: 32
learning_rate: 3.0e-4
min_learning_rate: 3.0e-5
warmup_steps: 500
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

# -------------------------------------------------------------------- execution
device: auto
dtype: bfloat16
compile_model: false        # torch.compile helps, and lengthens the first step
seed: 20260904
log_every: 20
eval_every: 500
eval_batches: 20
save_every: 500
sample_every: 1000
sample_prompt: "def "
sample_tokens: 96
held_out_fraction: 0.005
