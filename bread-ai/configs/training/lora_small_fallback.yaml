# Low-VRAM fallback: LoRA on a 1.5B coding model.
#
# Meant for 8-12 GB cards, laptops, and for proving the whole pipeline works
# before you commit hours to a 7B run. It trains in minutes. The resulting model
# is genuinely useful for short completions and simple explanations, and
# genuinely weaker than the 7B on anything that needs reasoning across files.

description: LoRA on a 1.5B model. Runs on 8-12 GB cards and finishes fast.
method: lora
min_vram_gb: 8

base_model_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
tokenizer_id: ""
dataset_path: data/datasets/bread_sft.jsonl
dataset_schema: sft_chat
eval_split_ratio: 0.05
output_dir: data/runs/lora-1_5b

load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true
bnb_4bit_compute_dtype: float16

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_bias: none
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

num_train_epochs: 3
max_steps: -1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.0002
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.0
max_grad_norm: 0.3
optim: paged_adamw_8bit
max_seq_length: 1024
packing: false

bf16: false
fp16: true
gradient_checkpointing: true
group_by_length: true
logging_steps: 5
save_steps: 100
save_total_limit: 2
eval_steps: 100
seed: 20260903
report_to: none
