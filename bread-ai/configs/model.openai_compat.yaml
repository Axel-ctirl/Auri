# Bread model profile: an OpenAI-compatible server you run yourself.
#
# Works with llama.cpp's llama-server, vLLM's OpenAI server, LM Studio and
# Ollama's compatibility endpoint. Bread only talks to the address you set here;
# the default stays on this machine.
#
#   llama-server -m model.gguf --port 8080 --host 127.0.0.1
#   BREAD_CONFIG_FILE=configs/model.openai_compat.yaml uvicorn app.main:app

model:
  MODEL_BACKEND: openai_compat
  OPENAI_COMPAT_BASE_URL: http://127.0.0.1:8080/v1
  OPENAI_COMPAT_API_KEY: not-needed
  OPENAI_COMPAT_MODEL: ""      # empty means "ask the server what it has loaded"
  MAX_CONTEXT_LENGTH: 8192
  MAX_NEW_TOKENS: 1024
  TEMPERATURE: 0.2
  TOP_P: 0.95

rag:
  EMBEDDING_MODEL_ID: sentence-transformers/all-MiniLM-L6-v2
  RAG_ENABLED: true
  RAG_TOP_K: 5
